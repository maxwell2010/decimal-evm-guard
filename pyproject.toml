[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decimal-guardian"
version = "0.3.2"
description = "Independent EVM signature guard for Decimal validators"
requires-python = ">=3.10"
dependencies = ["web3>=7,<8", "filelock>=3,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
decimal-guardian = "decimal_guardian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
